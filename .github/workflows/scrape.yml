name: Scrape RSS Feeds

on:
  schedule:
    # Twice daily for fresher homepage (SGT):
    # 23:00 UTC = 07:00 SGT (morning edition)
    # 10:00 UTC = 18:00 SGT (evening refresh)
    - cron: "0 23 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write
  actions: write # needed to dispatch deploy.yml explicitly (see note below)

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Hard safety cap: even with 18 feeds (8s timeout each) and LLM
    # classification (up to 5 fallback models × 30s each per article),
    # a healthy run should finish in well under 20 minutes. If it's still
    # going past that, something is genuinely stuck — force-kill it rather
    # than let it run indefinitely (as happened with run #1).
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Need full history so pull --rebase works cleanly against main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run RSS scraper
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/scrape-news.mjs

      - name: Commit updated feed.json
        id: commit
        run: |
          set -euo pipefail
          git config user.name "JoyPulse Bot"
          git config user.email "bot@joypulse.app"

          # Keep the scraped file aside — main may have moved during the long scrape
          cp public/feed.json /tmp/joypulse-feed.json

          # Sync to latest main, then re-apply the new feed (avoids non-fast-forward)
          git fetch origin main
          git checkout -B main origin/main

          cp /tmp/joypulse-feed.json public/feed.json
          git add public/feed.json

          if git diff --cached --quiet; then
            echo "No changes to feed.json vs current main"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "🌟 Update feed.json [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"

          # Retry push if another commit lands in the same second
          for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "Push succeeded on attempt $i"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $i) — re-sync and retry"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/joypulse-feed.json public/feed.json
            git add public/feed.json
            if git diff --cached --quiet; then
              echo "feed.json already up to date on remote"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "🌟 Update feed.json [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
            sleep 3
          done

          echo "Failed to push after retries"
          exit 1

      # IMPORTANT: a push made using the automatic GITHUB_TOKEN does NOT
      # trigger other workflows' "on: push" event (this is a deliberate
      # GitHub Actions restriction, to prevent infinite workflow chains).
      # Without this step, deploy.yml would never run after a scrape, and
      # the live site would keep showing stale data indefinitely even
      # though feed.json was updated correctly in the repo.
      - name: Trigger deploy workflow
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
